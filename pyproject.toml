[project]
name = "fvhd"
version = "0.1.0"
description = "Fast visualization of high-dimensional data"
authors = [
    { name = "Bartosz Minch", email = "minch@agh.edu.pl" },
    { name = "Filip Ręka", email = "filipreka@agh.edu.pl" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14.0,<3.15"
dependencies = [
    "torch>=2.5.1",
    "numpy>=2.2.2",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fvhd", "knn"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "black>=24.10.0",
    "isort>=5.13.2",
    "autoflake>=2.3.1",
    "torchvision>=0.20.1",
    "matplotlib>=3.10.0",
]